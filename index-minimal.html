<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Spectrum - Minimal Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0e27;
            color: white;
            padding: 40px;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            color: white;
        }
        button:hover {
            background: rgba(0, 240, 255, 0.3);
        }
        #output {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <h1>🌈 Learning Spectrum - Minimal Test</h1>
    <p>If you can see this and the buttons work, JavaScript is executing properly.</p>

    <button onclick="testButton()">Test Button Click</button>
    <button id="testListener">Test Event Listener</button>

    <div id="output"></div>

    <script>
        console.log('✅ JavaScript IS executing!');

        function testButton() {
            document.getElementById('output').innerHTML = '<p style="color: #00ff88;">✅ Inline onclick WORKS!</p>';
            console.log('✅ testButton() executed');
        }

        document.getElementById('testListener').addEventListener('click', function() {
            document.getElementById('output').innerHTML = '<p style="color: #ff006e;">✅ Event listener WORKS!</p>';
            console.log('✅ Event listener executed');
        });

        // Test for the specific errors you were seeing
        function selectCompanion(type) {
            console.log('selectCompanion called with:', type);
            return true;
        }

        function startLearning() {
            console.log('startLearning called');
            return true;
        }

        // Log that everything loaded
        window.onload = function() {
            console.log('✅ Page fully loaded');
            console.log('✅ selectCompanion function exists:', typeof selectCompanion);
            console.log('✅ startLearning function exists:', typeof startLearning);
        };
    </script>
</body>
</html>
